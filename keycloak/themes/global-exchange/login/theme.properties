# Tema de inicio de sesión de Global Exchange.
#
# Hereda todo del tema de Keycloak (keycloak.v2): las pantallas y los textos
# son los de siempre, y acá solo se cambia el aspecto con una hoja de estilos
# para que se parezca a la maqueta. Así sigue funcionando con registro,
# recuperación de contraseña y cualquier pantalla nueva de Keycloak.
parent=keycloak.v2
import=common/keycloak

# La hoja del tema padre y, después, la nuestra (pisa lo que haga falta).
styles=css/styles.css css/global-exchange.css

# Siempre claro, como la maqueta.
darkMode=false
