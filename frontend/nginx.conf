# nginx para servir la maqueta ya construida (ver frontend/Dockerfile).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La maqueta es una sola página: cualquier ruta que no sea un archivo
    # existente devuelve index.html y React decide qué mostrar.
    location / {
        try_files $uri /index.html;
    }

    # Los archivos de /assets llevan un hash en el nombre: si cambian, cambia
    # el nombre. Se pueden guardar en caché sin miedo a servir uno viejo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
