# Puerta de entrada del ambiente público (docker-compose.publico.yml).
#
# El túnel de Cloudflare entrega acá todo lo que llega a la dirección pública
# de la aplicación, y esto lo reparte:
#   /app/...  -> la maqueta (contenedor frontend)
#   el resto  -> Django (contenedor backend)
#
# Maqueta y backend tienen que compartir dominio: la maqueta llama a /api/ con
# la cookie de sesión de Django, y el navegador no la manda a otro dominio
# (SameSite=Lax). En desarrollo lo resuelve que los dos son "localhost".
server {
    listen 80;

    # Las redirecciones de nginx quedan relativas: el navegador entró por
    # https y una dirección absoluta armada acá diría http.
    absolute_redirect off;

    # Todo llega por el túnel, que ya es HTTPS. Django lo necesita saber para
    # armar bien la dirección de vuelta del login y marcar las cookies.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        # La barra final quita el /app/ antes de pasarlo a la maqueta.
        proxy_pass http://frontend:80/;
    }

    location / {
        proxy_pass http://backend:8000;
    }
}
